name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Python tests + ruff lint
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Frontend: type-check + lint + production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc, incl. noUnusedLocals/Parameters lint)
        run: npm run typecheck

      - name: Lint JS config files (ESLint)
        run: npm run lint:js

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # LLM Evaluation: offline contract check against the committed baseline
  # (no API key required; reuses the backend Pydantic contracts)
  # ---------------------------------------------------------------------------
  evaluation:
    name: LLM Evaluation (contract gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies (for Pydantic contracts)
        run: pip install -r backend/requirements.txt

      - name: Validate evaluation outputs against the V0.1 contract
        run: python evals/check_outputs.py evals/results/baseline-v0.1

      - name: Confirm baseline summary exists and is well-formed
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path("evals/results/baseline-v0.1/run-summary.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["case_count"] == data["success_count"], "baseline has failing cases"
          assert data["failure_count"] == 0, "baseline must be all-green to gate"
          print(f"Baseline OK: {data['success_count']}/{data['case_count']} cases succeeded")
          EOF
