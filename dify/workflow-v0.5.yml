    - data:
        code: "def main(question: dict, raw_result=None) -> dict:\n    question = question if isinstance(question, dict) else {}\n    return {\n        'result': {\n            'query_id': question.get('question_id'),\n            'search_result': raw_result,\n        }\n    }\n"
        code_language: python3
