                      - last_24_months
                      - any
                    priority:
                      type: string
                      enum:
                      - critical
                      - important
                      - exploratory
              search_limits:
                type: object
                additionalProperties: false
                required:
                - max_queries
                - max_results_per_query
                - max_retained_sources
