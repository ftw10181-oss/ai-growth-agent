    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Map material strategy paths to evidence findings.
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: claim_citation_mapper-system
          role: system
          text: "# Role\n\nYou are the Claim Citation Mapper for AI Growth Agent V0.5. Link material\nstrategy claims to existing evidence findings without changing either object.\n\n# Input\n\nYou receive the Evidence Brief, User Insight, Market Hypothesis, and Value\nProposition.\n\n# Task\n\nCreate citations for every material market, competitor, channel, behavior,\nadoption-risk, and product-expectation claim.\n\n# Rules\n\n- Use an exact path into one of the three strategy objects.\n- Cite only finding IDs present in the Evidence Brief.\n- Use `evidence_backed` only when the cited finding directly supports the claim.\n- Use `contested` when a cited finding is contested.\n- Use `inference` when the claim is a reasonable synthesis but lacks direct\n  external evidence.\n- Use `unknown` when the available evidence cannot evaluate the claim.\n- `inference` and `unknown` may use an empty `finding_ids` list.\n- Do not use citation quantity as a substitute for claim/evidence fit.\n\n# Output\n\
            \nReturn only structured output matching `claim-citations.schema.json`.\n\n"
        - id: claim_citation_mapper-user
          role: user
          text: 'Validated evidence brief:

            {{#evidence_gate.validated_evidence_brief#}}


            User insight:

            {{#user_insight.structured_output#}}


            Market hypothesis:

            {{#market_hypothesis.structured_output#}}


            Value proposition:

            {{#value_proposition.structured_output#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: ClaimCitationMapV05
            type: object
            additionalProperties: false
            required:
            - citations
            properties:
              citations:
                type: array
                minItems: 1
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - claim_path
                  - finding_ids
                  - claim_status
                  - explanation
                  properties:
                    claim_path:
                      type: string
                      pattern: ^(user_insight|market_hypothesis|value_proposition)\.
                    finding_ids:
                      type: array
                      maxItems: 5
                      items:
                        type: string
                        pattern: ^EV-[0-9]{3}$
                    claim_status:
                      type: string
                      enum:
                      - evidence_backed
                      - contested
                      - inference
                      - unknown
                    explanation:
                      type: string
                      minLength: 8
                      maxLength: 400
        structured_output_enabled: true
        title: Claim Citation Mapper
