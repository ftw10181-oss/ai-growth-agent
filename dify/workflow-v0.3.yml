    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Normalize the brief and expose assumptions before analysis.
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: context-system
          role: system
          text: '# Role


            You are the Context Interpreter for an overseas growth strategy product. Your job is to transform a raw growth brief into a precise, neutral analysis context for downstream agents.


            # Objectives


            1. Preserve the user''s explicit facts.

            2. Normalize vague or uneven wording without changing intent.

            3. Separate supplied information from reasonable assumptions.

            4. Identify ambiguity that could materially affect growth analysis.


            # Rules


            - Do not perform market research.

            - Do not invent statistics, user quotes, competitor facts, prices, product capabilities, or citations.

            - Treat the target audience as an initial hypothesis, not a verified segment.

            - If information is missing, record a concise assumption rather than silently filling the gap.

            - Keep the summary specific to the supplied product, market, audience, and goal.

            - Use English for all values.

            - Return only the configured structured output. No markdown or commentary.


            # Field guidance


            - `brief_summary`: 2–3 sentences connecting product, user, market, and goal.

            - `product_category`: a concise category inferred from the description.

            - `growth_stage`: one of `new_market_entry`, `launch`, `early_growth`, `scaling`, `retention`, `unknown`.

            - `primary_goal`: copy the supported business goal exactly.

            - `known_constraints`: only constraints explicitly supplied by the user.

            - `channel_signals`: channels mentioned by the user; do not add recommendations.

            - `assumptions`: missing or inferred conditions that downstream reasoning relies on.

            - `ambiguities`: questions whose answers could change the analysis.


            # Mandatory consistency check


            Before returning the configured output:


            1. `primary_goal` MUST exactly match the user''s `business_goal`.

            2. `brief_summary` MUST describe that same primary goal.

            3. Do not describe brand awareness, acquisition, conversion, retention, or community growth as the product''s objective unless it matches `business_goal`.

            4. Other objectives inferred from `additional_context` may only be presented as constraints or secondary considerations.

            5. If any output field conflicts with `business_goal`, revise it before returning the final object.

            '
        - id: context-user
          role: user
          text: 'Product: {{#start.product#}}

            Product description: {{#start.product_description#}}

            Target market: {{#start.target_market#}}

            Target audience: {{#start.target_audience#}}

            Business goal: {{#start.business_goal#}}

            Additional context: {{#start.additional_context#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              brief_summary:
                minLength: 20
                type: string
              product_category:
                minLength: 2
                type: string
              target_market:
                minLength: 2
                type: string
              target_audience:
                minLength: 2
                type: string
              growth_stage:
                enum:
                - new_market_entry
                - launch
                - early_growth
                - scaling
                - retention
                - unknown
                type: string
              primary_goal:
                enum:
                - Brand Awareness
                - User Acquisition
                - Conversion
                - Community Growth
                - Product Launch
                - Retention
                type: string
              known_constraints:
                items:
                  type: string
                maxItems: 8
                type: array
              channel_signals:
                items:
                  type: string
                maxItems: 8
                type: array
              assumptions:
                items:
                  type: string
                maxItems: 8
                minItems: 1
                type: array
              ambiguities:
                items:
                  type: string
                maxItems: 8
                type: array
            required:
            - brief_summary
            - product_category
            - target_market
            - target_audience
            - growth_stage
            - primary_goal
            - known_constraints
            - channel_signals
            - assumptions
            - ambiguities
            type: object
        structured_output_enabled: true
        title: Context Interpreter
        type: llm
        variables: []
        vision:
          enabled: false
      height: 120
      id: context_interpreter
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Generate ranked hypotheses with evidence basis, confidence, and validation status.
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: insight-system
          role: system
          text: "# Role\n\nYou are a senior growth researcher turning a normalized brief into testable user hypotheses for an overseas technology product.\n\n# Objective\n\nProduce a structured and evidence-aware user-insight hypothesis that helps a growth operator plan discovery interviews, messaging tests, and acquisition experiments.\n\n# Reasoning policy\n\n- Reason only from the normalized context and broadly applicable behavioral logic.\n- Frame every unverified claim as a hypothesis using cautious language such as “may,” “could,” or “hypothesis.”\n- Prefer situational specificity over demographic stereotypes.\n- Distinguish the functional, emotional, and social dimensions of the user's job.\n- Connect every pain, motivation, barrier, and scenario to the product and business goal.\n- Separate what the brief states from what you infer. The target audience field is an initial hypothesis, not proof of observed user behavior.\n- Do not invent statistics, market sizes, adoption rates, user\
            \ quotes, competitor claims, research findings, or citations.\n- Do not repeat the same idea across fields.\n- Use English for all values.\n- Return only the configured structured output. No markdown or commentary.\n\n# Output quality bar\n\n- `target_user`: one crisp primary segment and a one-sentence rationale.\n- `jobs_to_be_done`: 3–5 items. Write as “When…, I want to…, so I can…”. Include a `dimension`, `why_it_matters`, `decision_relevance`, and `evidence`.\n- `pain_points`: 2–5 specific frictions with a plausible trigger or workaround. Return fewer items when the context cannot support specificity.\n- `purchase_motivations`: 2–5 outcomes that could cause evaluation or purchase. Return fewer items when evidence is sparse.\n- `adoption_barriers`: 2–5 product, trust, habit, or operational obstacles. Do not add generic security, price, integration, or switching barriers without a contextual reason.\n- `typical_scenarios`: 2–5 observable situations, not generic activities.\
            \ Return fewer, stronger scenarios instead of filling five slots.\n- `research_questions`: 3–5 neutral questions that can validate or falsify the hypotheses.\n- `confidence`: `low`, `medium`, or `high`; use `low` when context is sparse and never use `high` for claims requiring external evidence.\n- `assumptions_to_validate`: carry forward important assumptions and add only those created by your reasoning.\n\n# Evidence contract for every JTBD and insight item\n\n- `decision_relevance`: use `primary` only when the item directly affects the submitted business goal; otherwise use `secondary`.\n- `evidence.basis` must be exactly one of:\n  - `explicit_brief`: directly stated in the normalized context. This preserves the user's input; it does not claim external verification.\n  - `contextual_inference`: a product- or workflow-specific inference supported by multiple signals in the brief.\n  - `behavioral_hypothesis`: a plausible but weakly supported behavior that requires discovery\
            \ research.\n- `evidence.confidence`: `low`, `medium`, or `high`. Use `high` only for `explicit_brief`; use `low` for behavioral hypotheses or sparse context.\n- `evidence.validation_status`: use `brief_supported` only with `explicit_brief`; otherwise use `needs_validation`.\n\n# Mandatory quality validation\n\nBefore returning the configured output:\n\n1. `jobs_to_be_done` MUST contain all three dimensions: `functional`, `emotional`, and `social`. For five items, use three functional, one emotional, and one social JTBD.\n2. Treat unsupported user behavior as a hypothesis. Do not use “often,” “many,” “frequently,” “significantly,” or similar frequency and magnitude claims unless evidence is provided.\n3. Scan every generated string for unsupported comparative or causal wording. The phrases “leads to,” “results in,” “directly impacts,” “improves,” “increases,” “decreases,” “enhances,” “faster,” and “better” are forbidden unless the same sentence explicitly starts with or contains\
            \ “hypothesis to test,” “may,” or “could.” Prefer neutral wording such as “is relevant to the conversion decision.”\n4. Keep `purchase_motivations` focused on outcomes experienced by the user, such as reducing administrative work, preventing lost decisions, improving accountability, or lowering evaluation risk.\n5. The first three `research_questions` MUST follow these three distinct patterns, in this order: (1) “Think about the most recent time…” to investigate a specific past experience; (2) “What do you use today…” to investigate the current workaround; (3) “What evidence or result would you need…” to investigate a trust threshold, switching trigger, or purchase threshold.\n6. Rank by decision relevance. Each of `jobs_to_be_done`, `pain_points`, `purchase_motivations`, `adoption_barriers`, and `typical_scenarios` MUST contain at least one `primary` item, and all `primary` items MUST appear before `secondary` items. A `primary` adoption barrier must describe an obstacle to\
            \ the submitted business goal, not a generic product concern.\n7. Check that evidence basis, confidence, and validation status are internally consistent for every item.\n8. Reduce repetition across `pain_points`, `adoption_barriers`, and `typical_scenarios`.\n9. Run a final mechanical check before returning: all five major sections contain `primary`; the first three research questions match the required patterns; and no forbidden causal or comparative phrase appears without explicit hypothesis language. If any check fails, revise the output internally before returning it.\n"
        - id: insight-user
          role: user
          text: 'Normalized growth context:

            {{#context_interpreter.structured_output#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: UserInsight
            type: object
            additionalProperties: false
            required:
            - target_user
            - jobs_to_be_done
            - pain_points
            - purchase_motivations
            - adoption_barriers
            - typical_scenarios
            - research_questions
            - assumptions_to_validate
            - confidence
            $defs:
              evidence:
                type: object
                additionalProperties: false
                required:
                - basis
                - confidence
                - validation_status
                properties:
                  basis:
                    type: string
                    enum:
                    - explicit_brief
                    - contextual_inference
                    - behavioral_hypothesis
                  confidence:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                  validation_status:
                    type: string
                    enum:
                    - brief_supported
                    - needs_validation
              insightItem:
                type: object
                additionalProperties: false
                required:
                - insight
                - why_it_matters
                - decision_relevance
                - evidence
                properties:
                  insight:
                    type: string
                    minLength: 8
                  why_it_matters:
                    type: string
                    minLength: 8
                  decision_relevance:
                    type: string
                    enum:
                    - primary
                    - secondary
                  evidence:
                    $ref: '#/$defs/evidence'
            properties:
              target_user:
                type: object
                additionalProperties: false
                required:
                - primary_segment
                - rationale
                properties:
                  primary_segment:
                    type: string
                    minLength: 8
                  rationale:
                    type: string
                    minLength: 12
              jobs_to_be_done:
                type: array
                minItems: 3
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - job
                  - dimension
                  - why_it_matters
                  - decision_relevance
                  - evidence
                  properties:
                    job:
                      type: string
                      minLength: 20
                    dimension:
                      type: string
                      enum:
                      - functional
                      - emotional
                      - social
                    why_it_matters:
                      type: string
                      minLength: 8
                    decision_relevance:
                      type: string
                      enum:
                      - primary
                      - secondary
                    evidence:
                      $ref: '#/$defs/evidence'
              pain_points:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  $ref: '#/$defs/insightItem'
              purchase_motivations:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  $ref: '#/$defs/insightItem'
              adoption_barriers:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  $ref: '#/$defs/insightItem'
              typical_scenarios:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  $ref: '#/$defs/insightItem'
              research_questions:
                type: array
                minItems: 3
                maxItems: 5
                items:
                  type: string
                  minLength: 10
              assumptions_to_validate:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  type: string
                  minLength: 8
              confidence:
                type: string
                enum:
                - low
                - medium
                - high
        structured_output_enabled: true
        title: User Insight
        type: llm
        variables: []
        vision:
          enabled: false
      height: 120
      id: user_insight
      position:
        x: 720
        y: 280
      positionAbsolute:
        x: 720
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Identify a narrow growth wedge, market risks, and validation priorities.
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: market_hypothesis-system
          role: system
          text: '# Role


            You are the Market Hypothesis module for an evidence-aware overseas growth product. You turn normalized context and structured user insight into a narrow, testable market-entry hypothesis.


            # Objective


            Help a growth operator decide which opportunity, behavior change, current alternative, and validation priority may deserve attention. Your output is a hypothesis set for discovery, not a market-research report.


            # Input policy


            - Use only the supplied `context` and `user_insight` objects.

            - Do not use outside knowledge as evidence.

            - Do not invent market size, market growth, demand level, willingness to pay, adoption rate, user frequency, competitor performance, research findings, statistics, quotes, or citations.

            - Treat the target audience and all inferred behavior as unverified until validated.

            - Prefer a narrow entry scenario over a broad market statement.

            - Use English for every value.

            - Return only the configured structured output. No markdown or commentary.


            # Source-reference contract


            Every material item must include one or more exact `source_refs` copied from the supplied objects. Do not repeat a reference within the same `source_refs` array.


            Valid examples:


            - `context.product_category`

            - `context.known_constraints.0`

            - `context.assumptions.1`

            - `user_insight.target_user.primary_segment`

            - `user_insight.jobs_to_be_done.0.job`

            - `user_insight.pain_points.1.insight`

            - `user_insight.purchase_motivations.0.insight`

            - `user_insight.adoption_barriers.0.insight`

            - `user_insight.typical_scenarios.2.insight`


            Rules:


            1. Never invent an index or path.

            2. Reference the smallest field that supports the statement.

            3. A source reference provides traceability, not external verification.

            4. If no upstream field supports a claim, omit the claim instead of creating a false reference.


            # Evidence contract


            - `explicit_brief`: directly present in normalized context; may use `high` confidence and `brief_supported`.

            - `contextual_inference`: supported by multiple product- or scenario-specific signals; must use `needs_validation` and at most `medium` confidence.

            - `behavioral_hypothesis`: plausible behavior with weak support; must use `needs_validation` and `low` confidence.

            - Downstream evidence must never be stronger than the weakest referenced upstream evidence.

            - A product capability in the brief does not prove that current alternatives lack that capability. For example, “the product supports real-time translation” does not support “translation apps are not real-time.”

            - A field named `brief_summary` may contain a concise synthesis. Use `explicit_brief` only for details that are plainly stated by the user, not for a new comparative conclusion built from the summary.


            # Field guidance


            - `opportunity_statement.hypothesis`: one narrow statement about a user, problem, and entry scenario. Use “may” or “hypothesis to test.”

            - `opportunity_statement.why_now`: explain the trigger visible in the supplied brief or scenario. Do not claim macro trends.

            - `current_alternatives`: 2–5 current workarounds or non-consumption options. If not explicit, mark each as a behavioral hypothesis.

            - `behavior_hypotheses`: 3–5 testable behaviors with a trigger and an observable signal.

            - `growth_wedge`: choose one initial segment and entry scenario; do not restate the full target market.

            - `competitive_frame`: compare with current alternatives or explicitly supplied competitors. Do not invent named competitors.

            - `main_risks`: prioritize falsifiable risks that could invalidate the opportunity.

            - `validation_priorities`: define a method plus measurable pass and fail signals. Every pass and fail signal must include a sample count, percentage, numeric threshold, or time bound. Avoid vague labels such as “high interest,” “positive feedback,” or “conduct more research.”

            - `confidence`: summarize confidence in the complete market hypothesis; never use `high` when external evidence is absent.


            # Claim-language policy


            Unsupported market language such as “large market,” “growing demand,” “most users,” “strong willingness to pay,” “competitive advantage,” “better,” “faster,” “improves,” or “increases” is forbidden unless the same sentence explicitly frames it as a hypothesis to test. Prefer neutral, falsifiable language.


            # Mandatory final validation


            Before returning:


            1. Confirm that every `source_ref` exists exactly in the supplied input.

            2. Confirm that every inferred item is `needs_validation`.

            3. Confirm that the growth wedge matches the upstream target user and at least one typical scenario.

            4. Confirm that no product capability appears unless it is present in context.

            5. Confirm that no named competitor appears unless supplied by the user.

            6. Confirm that validation priorities contain observable pass and fail signals.

            7. Confirm that no market claim is phrased as verified research.

            8. Confirm that every validation priority includes a numeric threshold, sample count, percentage, or time bound in both `pass_signal` and `fail_signal`.

            '
        - id: market_hypothesis-user
          role: user
          text: 'Normalized context:

            {{#context_interpreter.structured_output#}}


            Evidence-aware user insight:

            {{#user_insight.structured_output#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: MarketHypothesis
            type: object
            additionalProperties: false
            required:
            - opportunity_statement
            - current_alternatives
            - behavior_hypotheses
            - growth_wedge
            - competitive_frame
            - main_risks
            - validation_priorities
            - confidence
            $defs:
              sourceRefs:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  type: string
                  pattern: ^(context|user_insight)\.
              evidence:
                type: object
                additionalProperties: false
                required:
                - basis
                - confidence
                - validation_status
                properties:
                  basis:
                    type: string
                    enum:
                    - explicit_brief
                    - contextual_inference
                    - behavioral_hypothesis
                  confidence:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                  validation_status:
                    type: string
                    enum:
                    - brief_supported
                    - needs_validation
            properties:
              opportunity_statement:
                type: object
                additionalProperties: false
                required:
                - hypothesis
                - why_now
                - source_refs
                - evidence
                properties:
                  hypothesis:
                    type: string
                    minLength: 20
                  why_now:
                    type: string
                    minLength: 15
                  source_refs:
                    $ref: '#/$defs/sourceRefs'
                  evidence:
                    $ref: '#/$defs/evidence'
              current_alternatives:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - alternative
                  - limitation_hypothesis
                  - source_refs
                  - evidence
                  properties:
                    alternative:
                      type: string
                      minLength: 4
                    limitation_hypothesis:
                      type: string
                      minLength: 12
                    source_refs:
                      $ref: '#/$defs/sourceRefs'
                    evidence:
                      $ref: '#/$defs/evidence'
              behavior_hypotheses:
                type: array
                minItems: 3
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - hypothesis
                  - trigger
                  - expected_observation
                  - priority
                  - source_refs
                  - evidence
                  properties:
                    hypothesis:
                      type: string
                      minLength: 15
                    trigger:
                      type: string
                      minLength: 8
                    expected_observation:
                      type: string
                      minLength: 12
                    priority:
                      type: string
                      enum:
                      - critical
                      - important
                      - exploratory
                    source_refs:
                      $ref: '#/$defs/sourceRefs'
                    evidence:
                      $ref: '#/$defs/evidence'
              growth_wedge:
                type: object
                additionalProperties: false
                required:
                - segment
                - entry_scenario
                - rationale
                - source_refs
                - evidence
                properties:
                  segment:
                    type: string
                    minLength: 8
                  entry_scenario:
                    type: string
                    minLength: 12
                  rationale:
                    type: string
                    minLength: 15
                  source_refs:
                    $ref: '#/$defs/sourceRefs'
                  evidence:
                    $ref: '#/$defs/evidence'
              competitive_frame:
                type: object
                additionalProperties: false
                required:
                - compared_with
                - differentiation_hypothesis
                - less_suitable_for
                - source_refs
                - evidence
                properties:
                  compared_with:
                    type: array
                    minItems: 1
                    maxItems: 5
                    items:
                      type: string
                      minLength: 3
                  differentiation_hypothesis:
                    type: string
                    minLength: 15
                  less_suitable_for:
                    type: string
                    minLength: 10
                  source_refs:
                    $ref: '#/$defs/sourceRefs'
                  evidence:
                    $ref: '#/$defs/evidence'
              main_risks:
                type: array
                minItems: 3
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - risk
                  - consequence
