            - positioning_statement
            - reasons_to_believe
            - message_pillars
            - objections
            - message_tests
            - confidence
            $defs:
              sourceRefs:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  type: string
                  pattern: ^(context|user_insight|market_hypothesis)\.
              evidence:
