              message_tests:
                type: array
                minItems: 3
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - angle
                  - variant_a
                  - variant_b
                  - primary_metric
                  - expected_learning
                  - source_refs
                  properties:
                    angle:
                      type: string
